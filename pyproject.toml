[project]
name = "ldtk-map-creator"
version = "0.0.0"
description = "讓我和 AI agent 透過對話，從規則生成並微調 LDtk 場景地圖，每一步都看得到預覽圖。"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp>=2,<3",
    "pillow>=10.1",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "jsonschema",
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ldtk_map_creator"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 中文一律用全形標點，關掉「易混淆字元」三條
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "law(id): 這條測試證明 docs/laws.md 的哪一條 law，例如 law(\"GEN-1\")",
]
